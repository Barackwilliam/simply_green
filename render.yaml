# Render Blueprint for the Simply Green Organization website.
#
# One service. Django renders the public site, serves the admin the
# organisation's staff use, and exposes a JSON API for anything that needs it
# later. There is no separate frontend to build, deploy or keep in step.
#
# Frankfurt, beside the Supabase project in eu-central-1: the database round
# trip is what dominates response time.
#
# Every secret is `sync: false`, so Render asks for it and stores it on the
# service. Nothing sensitive lives in this file.
#
# The free plan sleeps after about fifteen minutes without traffic and takes
# roughly a minute to wake, and is capped at 512 MB — hence two Gunicorn
# workers. Moving to a paid plan is a one-line change below.

services:
  - type: web
    name: simply-green
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend

    # The free plan has no shell, so the first admin account and the content
    # draft are created during the build. Every step is idempotent:
    # `ensure_superuser` never touches an account that already exists,
    # `seed_content` only fills in what is missing unless passed --force,
    # and then runs `import_albums`, which fetches the client's Google
    # Photos albums into the gallery the first time and skips what is
    # already stored after that. It is called from `seed_content` rather
    # than listed here because the service's build command lives in the
    # Render dashboard, and an edit to this file does not change it.
    # `seed_sample_content --if-enabled` does nothing at all unless
    # SAMPLE_CONTENT is set (see below), and `repair_media` reconciles
    # what the database says about images with what storage actually has.
    #
    # That last step matters while uploads are on local disk: the disk is
    # rebuilt on every deploy but the database is not, so without it the
    # site comes back up pointing at photographs that no longer exist.
    # Setting the Supabase Storage keys below is the real fix.
    #
    # `checkmedia` runs last and prints where uploads are going, writing
    # a file to the bucket and reading it back over the web to prove it.
    # It is in the build because the free plan has no shell, so the
    # deploy log is the only place that answer can be read. It never
    # fails the build.
    buildCommand: >-
      pip install --no-cache-dir -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py ensure_superuser &&
      python manage.py seed_content &&
      python manage.py seed_sample_content --if-enabled &&
      python manage.py repair_media &&
      python manage.py checkmedia
    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 60
      --access-logfile -
      --error-logfile -
    healthCheckPath: /healthz/
    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: SECURE_SSL_REDIRECT
        value: "True"

      # --- Placeholder content for design review -----------------------
      # Impact figures, team, news, events, the gallery and the resource
      # centre render nothing while their tables are empty, which makes the
      # design impossible to show. Set this to "on" and redeploy to fill
      # them with clearly provisional content; the footer says so for as
      # long as it is loaded. Set it to "off" and redeploy to take it all
      # out again — only the rows the command created, nothing the client
      # has since added. Unset, nothing happens either way.
      #
      # TURN THIS OFF BEFORE LAUNCH. While it is on the site carries
      # invented impact figures and names of people who do not exist.
      - key: SAMPLE_CONTENT
        value: "on"

      # A leading dot matches every subdomain, which covers this service's own
      # onrender.com address. Add the custom domain here once it is connected.
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # --- First admin account -----------------------------------------
      # Created during the build because the free plan has no shell. Change
      # the password in the admin afterwards; the command never overwrites an
      # existing account, so the change sticks.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      # --- Supabase Postgres -------------------------------------------
      # Project Settings -> Database -> Connection string -> Session pooler
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_REQUIRE
        value: "True"

      # --- Supabase Storage --------------------------------------------
      # Project Settings -> Storage -> S3 access keys
      - key: USE_SUPABASE_STORAGE
        value: "True"
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: media
      - key: SUPABASE_S3_REGION
        value: eu-central-1
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false

      # --- Email notifications -----------------------------------------
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: NOTIFICATION_RECIPIENTS
        sync: false
